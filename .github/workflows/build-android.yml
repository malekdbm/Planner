name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/wedding-honeymoon-app-lqulj

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/Mariage-Lune-de-miel-${{ github.run_number }}.apk"
          ls -lh out/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: planner-android-apk
          path: out/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK · build ${{ github.run_number }}
          body: |
            APK debug installable. Active "Sources inconnues" sur ton Android pour l'installer.
          files: out/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
